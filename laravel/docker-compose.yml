# Local development only. Start PostgreSQL with: docker compose up -d --wait postgres
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: laravel_dev_password
      POSTGRES_DB: supermarket_erp_laravel_dev
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - laravel_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d supermarket_erp_laravel_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  tooling:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      COMPOSER_HOME: /tmp/composer
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  laravel_pg_data:
