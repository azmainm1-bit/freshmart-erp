name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: laravel

jobs:
  laravel:
    runs-on: ubuntu-latest

    # Real, isolated PostgreSQL — not SQLite. The concurrency/row-locking
    # tests require actual Postgres semantics and would silently pass or
    # fail differently under SQLite's file-level locking.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: laravel_ci_password
          POSTGRES_DB: supermarket_erp_laravel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: pdo_pgsql, pgsql, bcmath, mbstring, intl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: laravel/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Frontend lint
        run: npm run lint:check

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm run test

      - name: Build frontend assets
        run: npm run build

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Composer audit (fail on known vulnerabilities)
        run: composer audit

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Pint (style check, no auto-fix)
        run: vendor/bin/pint --test

      - name: PHPStan (static analysis)
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run migrations against the real test database
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: supermarket_erp_laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: laravel_ci_password

      - name: Backend tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: supermarket_erp_laravel_test
          DB_USERNAME: laravel
          DB_PASSWORD: laravel_ci_password
